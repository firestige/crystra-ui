name: UI release candidate

on:
  push:
    branches:
      - release/next

permissions:
  contents: read

concurrency:
  group: ui-release-candidate
  cancel-in-progress: false

jobs:
  qualify-and-publish-prerelease:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve immutable release request
        id: request
        run: |
          test "$GITHUB_REF_NAME" = release/next
          CANDIDATE_TAG="$(jq -er .candidate_tag release/request.json)"
          echo "$CANDIDATE_TAG" | grep -Eq '^crystra-ui-v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$'
          echo "candidate_tag=$CANDIDATE_TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run complete component qualification
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run package:verify
          npm run react18:verify
          npm run deps:check
          npx playwright install --with-deps chromium
          npm run browser
          npm run docker:smoke
          git diff --exit-code

      - name: Build exact candidate assets
        env:
          CANDIDATE_TAG: ${{ steps.request.outputs.candidate_tag }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          mkdir "$RUNNER_TEMP/package" "$RUNNER_TEMP/local-release"
          npm pack --silent --workspace crystra-ui-core --pack-destination "$RUNNER_TEMP/package"
          PACKAGE_ARCHIVE="$(find "$RUNNER_TEMP/package" -maxdepth 1 -name 'crystra-ui-core-*.tgz' -type f)"
          test -n "$PACKAGE_ARCHIVE"
          node release/cli/release.mjs build "$RUNNER_TEMP/local-release" "$RELEASE_TARGET" "$CANDIDATE_TAG" "$PACKAGE_ARCHIVE"
          node release/cli/release.mjs verify "$RUNNER_TEMP/local-release"

      - name: Resolve resumable candidate state
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ steps.request.outputs.candidate_tag }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          if gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = true
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$CANDIDATE_TAG" --jq .object.sha)" = "$RELEASE_TARGET"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$CANDIDATE_TAG" >/dev/null 2>&1
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint short-lived release App token after qualification
        id: release-app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CRYSTRA_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.CRYSTRA_RELEASE_APP_PRIVATE_KEY }}
          owner: firestige
          repositories: crystra-ui
          permission-contents: write

      - name: Create or exactly resume immutable candidate
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          CANDIDATE_TAG: ${{ steps.request.outputs.candidate_tag }}
          RC_EXISTS: ${{ steps.candidate.outputs.exists }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          if test "$RC_EXISTS" != true; then
            gh release create "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" "$RUNNER_TEMP/local-release/"* \
              --prerelease --target "$RELEASE_TARGET" --title "crystra-ui-core $CANDIDATE_TAG" \
              --notes-file "$RUNNER_TEMP/local-release/release-notes.md"
          fi
          mkdir "$RUNNER_TEMP/remote-release"
          gh release download "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/remote-release"
          node release/cli/release.mjs verify "$RUNNER_TEMP/remote-release"
          for FILE in "$RUNNER_TEMP/local-release/"*; do
            cmp "$FILE" "$RUNNER_TEMP/remote-release/$(basename "$FILE")"
          done
          if test -f "$RUNNER_TEMP/remote-release/release-qualification.json"; then
            node release/cli/release.mjs verify "$RUNNER_TEMP/remote-release" --qualified
          else
            node release/cli/release.mjs qualify "$RUNNER_TEMP/remote-release"
            gh release upload "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" "$RUNNER_TEMP/remote-release/release-qualification.json"
          fi
          mkdir "$RUNNER_TEMP/final-remote-release"
          gh release download "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/final-remote-release"
          node release/cli/release.mjs verify "$RUNNER_TEMP/final-remote-release" --qualified
